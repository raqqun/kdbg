name: Docker

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'assets/**'
  schedule:
    # Weekly, to pick up new kubectl patch releases and Alpine package updates
    - cron: '0 4 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # How many Kubernetes minor versions to build, counting back from the newest
  SUPPORTED_MINORS: 3

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve kubectl and crictl versions
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stable=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
          major=$(echo "${stable#v}" | cut -d. -f1)
          newest=$(echo "${stable#v}" | cut -d. -f2)
          crictl_releases=$(gh api 'repos/kubernetes-sigs/cri-tools/releases?per_page=100' \
            -q '.[] | select((.draft or .prerelease) | not) | .tag_name | ltrimstr("v")')
          entries=()
          # Oldest first, so the newest version is built and published last
          for i in $(seq $((SUPPORTED_MINORS - 1)) -1 0); do
            minor="${major}.$((newest - i))"
            version=$(curl -fsSL "https://dl.k8s.io/release/stable-${minor}.txt")
            # The newest crictl release for this minor version. cri-tools is
            # released a few weeks after Kubernetes, so until then, the newest
            # release of an earlier minor version.
            crictl=$(echo "$crictl_releases" | awk -F. -v major="$major" -v minor="$((newest - i))" \
              '$1 == major && $2 <= minor' | sort -V | tail -1)
            latest=$([ "$i" -eq 0 ] && echo true || echo false)
            echo "kubectl ${minor} -> ${version#v}, crictl ${crictl}"
            entries+=("$(jq -nc --arg minor "$minor" --arg version "${version#v}" --arg crictl "$crictl" --argjson latest "$latest" \
              '{minor: $minor, version: $version, crictl: $crictl, latest: $latest}')")
          done
          echo "matrix=$(printf '%s\n' "${entries[@]}" | jq -sc '{include: .}')" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # One at a time, in matrix order. GitHub's package page shows the most
      # recently published version as the latest, so the newest kubectl
      # version has to be pushed last.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    name: build kubectl ${{ matrix.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=${{ matrix.minor }}
            type=raw,value=latest,enable=${{ matrix.latest }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            KUBECTL_VERSION=${{ matrix.version }}
            CRICTL_VERSION=${{ matrix.crictl }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kubectl-${{ matrix.minor }}
          cache-to: type=gha,mode=max,scope=kubectl-${{ matrix.minor }}
